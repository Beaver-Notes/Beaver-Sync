app = "beaver-sync-hocuspocus"

kill_timeout = 30

[env]
  NODE_ENV = "production"
  AUTH_BACKEND_URL = "http://beaver-sync.internal:3000"
  HOCUSPOCUS_PORT = "8080"
  HOCUSPOCUS_GLITCHTIP_DSN = ""

[[services]]
  port = 8080
  protocol = "tcp"
  internal_port = 8080

  [[services.ports]]
    port = 8080
    handlers = ["http"]
