name: CI

on:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beaver
          POSTGRES_PASSWORD: beaver
          POSTGRES_DB: beaver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beaver"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test
        env:
          TEST_DATABASE_URL: postgresql://beaver:beaver@localhost:5432/beaver_test

      - name: Audit dependencies (fail on critical)
        run: yarn audit --audit-level=critical
