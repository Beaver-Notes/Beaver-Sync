name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: beaver
          POSTGRES_PASSWORD: beaver
          POSTGRES_DB: beaver_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U beaver"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # Object storage runs as a plain `docker run` in a step below, not a service
    # container: GHA services cannot pass a command, and seaweedfs needs
    # `server -s3 -s3.config=...` to expose the S3 gateway at all.

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # Same image + tag as docker-compose.test.yml, so CI and the local test
      # stack exercise the same object storage. Credentials come from
      # seaweedfs/s3.json because seaweedfs only reads AWS_* env vars from 3.96.
      - name: Start SeaweedFS and create the bucket
        run: |
          docker run -d --name seaweedfs-ci -p 9000:9000 \
            -v "$GITHUB_WORKSPACE/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:3.71 \
            server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
          for i in $(seq 1 30); do
            # Probe the published S3 port. The master API (9333) is not published,
            # so probing it from the runner always times out. A bare GET answers
            # 403 (S3 gateway up, bucket/anon denied), which is the state we want,
            # hence no curl -f: -f would turn that into a retry.
            if curl -sS -o /dev/null --max-time 2 http://localhost:9000/ 2>/dev/null; then
              echo "SeaweedFS ready on attempt $i"
              break
            fi
            if [ "$i" = "30" ]; then
              echo "SeaweedFS never became ready"
              docker logs seaweedfs-ci || true
              exit 1
            fi
            sleep 1
          done
          STORAGE_ENDPOINT=http://localhost:9000 STORAGE_BUCKET_NAME=beaver-sync STORAGE_ACCESS_KEY_ID=beaver STORAGE_SECRET_ACCESS_KEY=beaver-dev-secret STORAGE_FORCE_PATH_STYLE=true node -e "
            const { ensureBucket } = require('./src/services/r2');
            ensureBucket().then(() => console.log('bucket ready')).catch(e => { console.error(e.message); process.exit(1); });
          "

      - name: Lint
        run: yarn lint

      # Legacy-JWT tests default to the gitignored keys/*.pem; generate a
      # throwaway CI-only keypair so the files exist.
      - name: Generate throwaway JWT test keys
        run: bash scripts/generate-keys.sh

      - name: Test
        run: yarn test
        env:
          TEST_DATABASE_URL: postgresql://beaver:beaver@localhost:5432/beaver_test
          STORAGE_ENDPOINT: http://localhost:9000
          STORAGE_BUCKET_NAME: beaver-sync
          STORAGE_ACCESS_KEY_ID: beaver
          STORAGE_SECRET_ACCESS_KEY: beaver-dev-secret
          STORAGE_FORCE_PATH_STYLE: "true"

      - name: Audit dependencies (fail on critical)
        run: yarn audit --audit-level=critical

  container-smoke:
    name: Container smoke (API + relay)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Clean any stale scratch volumes
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans || true

      - name: Build API+relay from scratch (no cache)
        run: docker compose -f docker-compose.test.yml build --no-cache api ws-relay

      - name: Image size report (measured)
        run: |
          echo "### Image size report" >> "$GITHUB_STEP_SUMMARY"
          echo "| image | id | size | digest |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          for img in $(docker images --format "{{.Repository}}:{{.Tag}}" | grep -E "beaver-sync"); do
            id=$(docker inspect --format='{{.Id}}' "$img" 2>/dev/null | cut -c1-19)
            size=$(docker images --format "{{.Repository}}:{{.Tag}} {{.Size}}" | grep -F "$img " | awk '{print $2}')
            digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$img" 2>/dev/null || echo "n/a")
            echo "| $img | $id | $size | $digest |" >> "$GITHUB_STEP_SUMMARY"
            echo "$img $id $size $digest"
          done
          echo "" >> "$GITHUB_STEP_SUMMARY"
          docker images --digests | grep -E "beaver-sync|REPOSITORY" | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "history api:" >> "$GITHUB_STEP_SUMMARY"
          docker history beaver-sync-api 2>&1 | head -20 >> "$GITHUB_STEP_SUMMARY" || true

      - name: Up stack against scratch PG/SeaweedFS
        env:
          ENTERPRISE_MODE: "true"
          LICENSE_SECRET: ci-smoke-license-secret-32-chars-long!!
          LICENSE_KEY: BLeyJleHBpcnkiOiIyMDM1LTAxLTAxIiwibGljZW5zZWUiOiJCZWF2ZXIgQ0kgU21va2UiLCJwbGFuIjoiZW50ZXJwcmlzZSJ9.q9Mj_otTJWKIIhwfE4qV0NzhuQ_KV7HuXVlUtG9F7Eo
          SESSION_HMAC_KEY: ci-smoke-session-hmac-key-32-chars-long!
          EMAIL_HMAC_KEY: ci-smoke-email-hmac-key-32-chars-long!!
          COOKIE_SECRET: ci-smoke-cookie-secret-32-chars-long!!!
          NOTE_HMAC_KEY: ci-smoke-note-hmac-key-32-chars-long!!
        run: docker compose -f docker-compose.test.yml up -d --wait

      - name: Wait for API /health green
        run: |
          set -e
          echo "Polling http://localhost:4000/health ..."
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health 2>/dev/null | grep -q '"status":"ok"'; then
              echo "health ok on attempt $i"
              curl -fsS http://localhost:4000/health
              break
            fi
            if [ "$i" = "30" ]; then
              echo "API /health never turned green"
              docker compose -f docker-compose.test.yml logs --no-color api || true
              exit 1
            fi
            sleep 2
          done
          curl -fsS http://localhost:4000/health | grep -q '"db":"connected"'
          echo "/health db connected ✓"

      - name: Assert 30s alive
        run: |
          set -e
          echo "Sleep 30s then verify both containers still running and healthy..."
          sleep 30
          docker inspect --format='{{.State.Status}}' beaver-sync-test-api | grep -q running
          docker inspect --format='{{.State.Status}}' beaver-sync-test-ws-relay | grep -q running
          # restart count should be 0 (no crash-loop)
          api_restarts=$(docker inspect --format='{{.RestartCount}}' beaver-sync-test-api)
          relay_restarts=$(docker inspect --format='{{.RestartCount}}' beaver-sync-test-ws-relay)
          echo "api restarts=$api_restarts relay restarts=$relay_restarts"
          [ "$api_restarts" = "0" ] || { echo "API restarted unexpectedly"; exit 1; }
          [ "$relay_restarts" = "0" ] || { echo "relay restarted unexpectedly (MODULE_NOT_FOUND regression)"; exit 1; }
          curl -fsS http://localhost:4000/health | grep -q '"status":"ok"'
          curl -fsS http://localhost:8080/ | grep -q '"status":"ok"'
          echo "30s alive + health green + relay http ok ✓"

      - name: Ticket-socket smoke (MODULE_NOT_FOUND regression)
        run: |
          set -e
          npm install --no-save ws >/dev/null 2>&1
          node <<'NODEJS'
          const WebSocket = require('ws');
          const API = 'http://localhost:4000';
          const WS_HOST = 'ws://localhost:8080';
          const email = `smoke-${Date.now()}@example.com`;
          const password = 'SmokeTestPass123!';
          async function mustJson(res, label) {
            const txt = await res.text();
            let j; try { j = JSON.parse(txt); } catch { throw new Error(`${label} non-JSON ${res.status}: ${txt.slice(0,400)}`); }
            if (!res.ok) throw new Error(`${label} ${res.status}: ${JSON.stringify(j).slice(0,600)}`);
            return j;
          }
          (async () => {
            console.log(`register ${email} ...`);
            let r = await fetch(`${API}/auth/register`, {
              method: 'POST', headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ email, password })
            });
            const reg = await mustJson(r, 'register');
            const token = reg.token;
            const wsId = reg.workspace?.id;
            if (!token) throw new Error('no token from register');
            if (!wsId) throw new Error('no workspace id — ENTERPRISE_MODE must be true so registration provisions workspace');
            console.log(`registered ws=${wsId} token=${token.slice(0,10)}...`);

            console.log('issuing ws-ticket ...');
            r = await fetch(`${API}/auth/ws-ticket`, {
              method: 'POST', headers: { 'content-type': 'application/json', 'authorization': `Bearer ${token}` },
              body: JSON.stringify({ workspaceId: wsId })
            });
            const tj = await mustJson(r, 'ws-ticket');
            const ticket = tj.ticket;
            if (!ticket) throw new Error('no ticket');
            console.log(`ticket=${ticket.slice(0,10)}...`);

            const room = `workspace:${wsId}:meta`;
            const url = `${WS_HOST}/${room}?ticket=${ticket}`;
            console.log(`connecting ${url} ...`);
            const ws = new WebSocket(url);
            let gotAuth = false;
            const timeout = setTimeout(() => { console.error('WS timeout waiting for auth frame'); process.exit(1); }, 8000);
            ws.on('open', () => console.log('ws open'));
            ws.on('message', (data, isBin) => {
              if (isBin) return;
              try {
                const msg = JSON.parse(data.toString());
                if (msg.type === 'auth') {
                  gotAuth = true;
                  clearTimeout(timeout);
                  console.log(`ws auth frame: ${JSON.stringify(msg)} ✓`);
                  ws.close();
                }
              } catch {}
            });
            ws.on('error', e => { console.error('ws error', e.message); process.exit(1); });
            ws.on('close', (code) => {
              if (!gotAuth) { console.error(`ws closed before auth code=${code}`); process.exit(1); }
              console.log('ticket-socket ok ✓ (MODULE_NOT_FOUND regression covered)');
              process.exit(0);
            });
            ws.on('unexpected-response', (_req, res) => {
              console.error(`ws upgrade rejected HTTP ${res.statusCode}`);
              res.destroy();
              process.exit(1);
            });
          })().catch(e => { console.error(e.stack || e.message); process.exit(1); });
          NODEJS

      - name: Dump logs on failure
        if: failure()
        run: |
          echo "=== docker ps ==="; docker ps -a || true
          echo "=== compose logs ==="; docker compose -f docker-compose.test.yml logs --no-color || true
          echo "=== api health ==="; curl -fsS http://localhost:4000/health || true
          echo "=== relay http ==="; curl -fsS http://localhost:8080/ || true

      - name: Teardown scratch stack
        if: always()
        run: docker compose -f docker-compose.test.yml down -v --remove-orphans || true
