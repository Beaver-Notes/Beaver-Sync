version: '3.9'

# Beaver Sync - Docker Compose
#
# One command to run everything:
#   docker compose up -d
#
# First time setup:
#   1. cp .env.example .env && fill in your values
#   2. yarn run generate-keys
#   3. docker compose up -d

services:

  postgres:
    image: postgres:16-alpine
    container_name: beaver-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beaver}
      POSTGRES_USER: ${POSTGRES_USER:-beaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beaver}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      # Host port is overridable like API_PORT so the stack does not collide
      # with a Postgres already listening on 5432; in-network stays 5432.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beaver}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SeaweedFS (local S3-compatible object storage; credentials come from ./seaweedfs/s3.json)
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: beaver-sync-seaweedfs
    restart: unless-stopped
    # -volume.max=16/-master.volumePreallocate=false: the image entrypoint otherwise
    # passes -volume.max=0, which auto-sizes the cap from free disk minus the 1GB
    # reserved per existing volume. Once that goes negative the cap collapses to the
    # current volume count, no volume can be grown, and every PUT to the bucket-named
    # collection fails with "no free volumes left" (S3 500 InternalError).
    command: server -dir=/data -volume.max=16 -master.volumePreallocate=false -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      # the legacy object-store volume holds data in the old object-store layout
      # that SeaweedFS cannot read; back it up and start fresh
      - seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beaver-sync-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver}@postgres:5432/${POSTGRES_DB:-beaver}
      NODE_ENV: production
      # provider label, not a server name: read by the useProxy check in src/routes/assets-presign.js
      STORAGE_BACKEND: ${STORAGE_BACKEND:-seaweedfs}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://seaweedfs:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://${LAN_IP:-localhost}:9000}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-beaver-sync}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-beaver}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-beaver-dev-secret}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      LEGACY_AUTH_ENABLED: ${LEGACY_AUTH_ENABLED:-true}
      APP_URL: ${APP_URL:-http://localhost:4000}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:3000"
    volumes:
      - beaver_data:/app/keys
      # Share the host's ML-KEM seed so the API and scripts/seed-test-tier.mjs
      # derive the same key. Without it the container invents its own on first
      # use, so anything the seed script seals is undecryptable by the API.
      - ./keys/mlkem-seed.hex:/app/keys/mlkem-seed.hex:ro
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ws-relay:
    build:
      context: .
      dockerfile: Dockerfile.ws-relay
    container_name: beaver-sync-ws-relay
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver}@postgres:5432/${POSTGRES_DB:-beaver}
      AUTH_BACKEND_URL: http://api:3000
    command: ["node", "src/ws-relay.js"]
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Backups: compressed pg_dump on a schedule; opt-out with BACKUP_INTERVAL_SECONDS=0
  pg-backup:
    image: postgres:16-alpine
    container_name: beaver-sync-pg-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver}@postgres:5432/${POSTGRES_DB:-beaver}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_S3_TARGET: ${BACKUP_S3_TARGET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
    volumes:
      - ./backups:/backups
      - ./scripts/backup-postgres.sh:/usr/local/bin/backup-postgres.sh:ro
    entrypoint: >
      sh -c "
        chmod +x /usr/local/bin/backup-postgres.sh 2>/dev/null || true;
        trap 'exit 0' TERM INT;
        while true; do
          if [ \"$${BACKUP_INTERVAL_SECONDS:-86400}\" = \"0\" ]; then echo '[pg-backup] disabled (BACKUP_INTERVAL_SECONDS=0)'; sleep 86400; continue; fi;
          BACKUP_DIR=/backups /usr/local/bin/backup-postgres.sh || echo '[pg-backup] dump failed';
          sleep $${BACKUP_INTERVAL_SECONDS:-86400} & wait $$!;
        done"
    networks:
      - beaver-internal

volumes:
  pg_data:
  seaweed_data:
  beaver_data:

networks:
  beaver-internal:
    driver: bridge
