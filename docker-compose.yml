version: '3.9'

# Beaver Sync - Docker Compose
#
# One command to run everything:
#   docker compose up -d
#
# First time setup:
#   1. cp .env.example .env && fill in your values
#   2. yarn run generate-keys
#   3. docker compose up -d

services:

  postgres:
    image: postgres:16-alpine
    container_name: beaver-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beaver}
      POSTGRES_USER: ${POSTGRES_USER:-beaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beaver}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beaver}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (default self-hosted object storage)
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: beaver-sync-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: beaver-sync-minio-setup
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done &&
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-beaver-sync}"
    networks:
      - beaver-internal

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beaver-sync-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver}@postgres:5432/${POSTGRES_DB:-beaver}
      NODE_ENV: production
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://${LAN_IP:-localhost}:9000}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-beaver-sync}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      LEGACY_AUTH_ENABLED: ${LEGACY_AUTH_ENABLED:-true}
      APP_URL: ${APP_URL:-http://localhost:4000}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:3000"
    volumes:
      - beaver_data:/app/keys
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ws-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beaver-sync-ws-relay
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver}@postgres:5432/${POSTGRES_DB:-beaver}
      AUTH_BACKEND_URL: http://api:3000
    command: ["node", "src/ws-relay.js"]
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  pg_data:
  minio_data:
  beaver_data:

networks:
  beaver-internal:
    driver: bridge
