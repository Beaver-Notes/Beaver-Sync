version: '3.9'

# Beaver Sync - Docker Compose
#
# One command to run everything:
#   docker-compose up -d
#
# First time setup:
#   1. cp .env.example .env && fill in your values
#   2. yarn run generate-keys
#   3. docker-compose up -d

services:

  # MinIO (default self-hosted object storage)
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: beaver-sync-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    networks:
      - beaver-internal

  minio-setup:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: beaver-sync-minio-setup
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done &&
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-beaver-sync}"
    networks:
      - beaver-internal

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beaver-sync-api
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_started
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/beaver.db
      NODE_ENV: production
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-beaver-sync}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      LEGACY_AUTH_ENABLED: ${LEGACY_AUTH_ENABLED:-true}
    ports:
      - "3000:3000"
    volumes:
      - ./keys:/app/keys:ro
      - beaver_data:/app/data
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  minio_data:
  beaver_data:

networks:
  beaver-internal:
    driver: bridge
