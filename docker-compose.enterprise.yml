version: '3.9'

# Beaver Sync - Enterprise Self-Hosted
#
# Fully air-gapped deployment: no external services required.
# All traffic stays within the Docker internal network.
#
# Usage:
#   cp .env.example .env && fill in SECRET_KEY, LICENSE_SECRET, LICENSE_KEY, etc.
#   docker compose -f docker-compose.enterprise.yml up -d
#
# First-time setup:
#   1. Set ENTERPRISE_MODE=true, LICENSE_SECRET and LICENSE_KEY in your .env
#      Generate: LICENSE_SECRET=$(openssl rand -hex 32) node scripts/generate-license.js --licensee "Acme" --expiry 2027-08-30 --seats 50
#   2. docker compose -f docker-compose.enterprise.yml up -d
#   3. Access the API at http://localhost:4000
#   4. Licenses are offline HMAC BL... tokens (canonical JSON, timing-safe verify, 14d grace, seats soft-warn)

networks:
  beaver-internal:
    driver: bridge

volumes:
  pg_data:
  # The legacy object-store volume holds data in the old object-store layout that
  # SeaweedFS cannot read; back it up before the first `up`.
  seaweed_data:
  beaver_data:
  glitchtip_db:
  glitchtip_data:

services:

  postgres:
    image: postgres:16-alpine
    container_name: beaver-sync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beaver}
      POSTGRES_USER: ${POSTGRES_USER:-beaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beaver}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beaver}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── SeaweedFS (S3-compatible object storage) ─────────────────────
  seaweedfs:
    image: chrislusf/seaweedfs:3.71
    container_name: beaver-sync-seaweedfs
    restart: unless-stopped
    # -volume.max=16/-master.volumePreallocate=false: the image entrypoint otherwise
    # passes -volume.max=0, which auto-sizes the cap from free disk minus the 1GB
    # reserved per existing volume. Once that goes negative the cap collapses to the
    # current volume count, no volume can be grown, and every PUT to the bucket-named
    # collection fails with "no free volumes left" (S3 500 InternalError).
    command: server -dir=/data -volume.max=16 -master.volumePreallocate=false -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "127.0.0.1:9000:9000"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ── Glitchtip (Sentry-compatible error monitoring) ──────────────
  glitchtip-db:
    image: postgres:16-alpine
    container_name: beaver-sync-glitchtip-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:-glitchtip}
    volumes:
      - glitchtip_db:/var/lib/postgresql/data
    networks:
      - beaver-internal

  glitchtip:
    image: glitchtip/glitchtip:v3.2
    container_name: beaver-sync-glitchtip
    restart: unless-stopped
    depends_on:
      glitchtip-db:
        condition: service_started
    environment:
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:-glitchtip}@glitchtip-db:5432/glitchtip
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-change-me-glitchtip-secret}
      PORT: 8000
      EMAIL_BACKEND: dummy
      CELERY_TASK_ALWAYS_EAGER: "True"
      SENTRY_DSN: ""
    volumes:
      - glitchtip_data:/data
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      - beaver-internal

  # ── API Server ───────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beaver-sync-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
      glitchtip:
        condition: service_started
    env_file: .env
    environment:
      ENTERPRISE_MODE: "true"
      LICENSE_SECRET: ${LICENSE_SECRET}
      LICENSE_KEY: ${LICENSE_KEY:-${BEAVER_LICENSE:-${LICENSE:-}}}
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver}@postgres:5432/${POSTGRES_DB:-beaver}
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      COOKIE_SECRET: ${COOKIE_SECRET:-change-me-cookie-secret}
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY}
      EMAIL_HMAC_KEY: ${EMAIL_HMAC_KEY}
      NOTE_HMAC_KEY: ${NOTE_HMAC_KEY}
      MLKEM_SEED: ${MLKEM_SEED}
      GLITCHTIP_DSN: http://glitchtip:8000/glitchtip-dsn
      # Provider label, not a server name; the useProxy check in src/routes/assets-presign.js branches on it
      STORAGE_BACKEND: seaweedfs
      STORAGE_ENDPOINT: http://seaweedfs:9000
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-beaver-sync}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-beaver}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-beaver-dev-secret}
      STORAGE_REGION: us-east-1
      STORAGE_FORCE_PATH_STYLE: "true"
      WEBAUTHN_RPID: ${WEBAUTHN_RPID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3000}
      APP_URL: ${APP_URL:-http://localhost:4000}
    ports:
      - "127.0.0.1:${API_PORT:-4000}:3000"
    volumes:
      - beaver_data:/app/keys
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ── WebSocket Relay ─────────────────────────────────────────────
  ws-relay:
    build:
      context: .
      dockerfile: Dockerfile.ws-relay
    container_name: beaver-sync-ws-relay
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      ENTERPRISE_MODE: "true"
      WS_RELAY_PORT: "8080"
      AUTH_BACKEND_URL: http://api:3000
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY}
      MLKEM_SEED: ${MLKEM_SEED}
      GLITCHTIP_DSN: http://glitchtip:8000/glitchtip-dsn
    command: ["node", "src/ws-relay.js"]
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
