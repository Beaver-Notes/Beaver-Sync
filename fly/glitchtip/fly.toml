app = "beaver-glitchtip"
primary_region = "iad"

[build]
  image = "glitchtip/glitchtip:v3.2"

[env]
  PORT = "8000"
  DATABASE_URL = "sqlite:////data/glitchtip.db"
  EMAIL_BACKEND = "dummy"
  CELERY_TASK_ALWAYS_EAGER = "True"
  ALLOWED_HOSTS = "*"

[mounts]
  source = "glitchtip_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = false
  auto_stop_machines = false
  auto_start_machines = true
