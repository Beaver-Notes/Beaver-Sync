app = "beaver-glitchtip"
primary_region = "iad"

[build]
  image = "glitchtip/glitchtip:v3.2"

[env]
  PORT = "8000"
  DATABASE_URL = "sqlite:////data/glitchtip.db"
  EMAIL_BACKEND = "dummy"
  CELERY_TASK_ALWAYS_EAGER = "True"
  ALLOWED_HOSTS = "*"

[mounts]
  source = "glitchtip_data"
  destination = "/data"
