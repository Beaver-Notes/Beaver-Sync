app = "beaver-sync-hocuspocus"
primary_region = "iad"

[build]
  dockerfile = "../../Dockerfile"

[env]
  NODE_ENV = "production"
  HOCUSPOCUS_PORT = "8080"
  AUTH_BACKEND_URL = "http://beaver-sync-api.internal:3000"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

  [http_service.concurrency]
    type = "connections"
    hard_limit = 1000
    soft_limit = 500

[[http_service.checks]]
  grace_period = "5s"
  interval = "30s"
  method = "GET"
  path = "/"
  timeout = "5s"