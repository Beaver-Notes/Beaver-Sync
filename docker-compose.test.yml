version: '3.9'

# Beaver Sync - Docker Compose (test / staging environment)
#
# Prod-mode stack for manual verification of a seeded tier:
#   PLAN_OVERRIDE=team npm run seed:tier -- team tester@example.com 'TestPassword123!'
#   docker compose -f docker-compose.test.yml up -d
#
# LAN reachability (second device / another browser on your network):
#   LAN_IP=192.168.1.161 docker compose -f docker-compose.test.yml up -d --build
# Ports bind to 0.0.0.0 (all interfaces). STORAGE_PUBLIC_ENDPOINT and
# ALLOWED_ORIGINS are built from LAN_IP so presigned URLs and CORS work for
# remote clients. Defaults (no LAN_IP) keep the loopback-only behavior.
# PLAN_OVERRIDE forces the effective plan so seeded accounts can exercise
# paid-plan features without a real payment.

services:

  postgres:
    image: postgres:16-alpine
    container_name: beaver-sync-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beaver}
      POSTGRES_USER: ${POSTGRES_USER:-beaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beaver}
    volumes:
      - test_pg_data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beaver}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (default self-hosted object storage)
  minio:
    image: minio/minio:RELEASE.2025-02-28T09-55-16Z
    container_name: beaver-sync-test-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - test_minio_data:/data
    ports:
      - "0.0.0.0:9000:9000"
      - "0.0.0.0:9001:9001"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "mc ready local"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-setup:
    image: minio/mc:RELEASE.2025-02-21T16-00-46Z
    container_name: beaver-sync-test-minio-setup
    depends_on:
      minio:
        condition: service_started
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 1; done &&
      mc mb --ignore-existing local/${MINIO_BUCKET_NAME:-beaver-sync}"
    networks:
      - beaver-internal

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beaver-sync-test-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver}@postgres:5432/${POSTGRES_DB:-beaver}
      NODE_ENV: production
      EMAIL_ENABLED: "false"
      PLAN_OVERRIDE: ${PLAN_OVERRIDE:-free}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-minio}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://${LAN_IP:-localhost}:9000}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-beaver-sync}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-minioadmin}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-minioadmin}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      LEGACY_AUTH_ENABLED: ${LEGACY_AUTH_ENABLED:-true}
      ALLOWED_ORIGINS: ${TEST_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://${LAN_IP:-127.0.0.1}:5173}
      APP_URL: ${APP_URL:-http://localhost:4000}
    ports:
      - "0.0.0.0:${API_PORT:-4000}:3000"
    volumes:
      - beaver_data:/app/keys
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ws-relay:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beaver-sync-test-ws-relay
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver}@postgres:5432/${POSTGRES_DB:-beaver}
      AUTH_BACKEND_URL: http://api:3000
    command: ["node", "src/ws-relay.js"]
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  test_pg_data:
  test_minio_data:
  beaver_data:

networks:
  beaver-internal:
    driver: bridge
