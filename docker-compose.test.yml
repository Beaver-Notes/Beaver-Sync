version: '3.9'

# Beaver Sync - Docker Compose (test / staging environment)
#
# Prod-mode stack for manual verification of a seeded tier:B
#   PLAN_OVERRIDE=team npm run seed:tier -- team tester@example.com 'TestPassword123!'
#   docker compose -f docker-compose.test.yml up -d
#
# LAN reachability (second device / another browser on your network):
#   LAN_IP=192.168.1.161 docker compose -f docker-compose.test.yml up -d --build
# Ports bind to 0.0.0.0 (all interfaces). STORAGE_PUBLIC_ENDPOINT and
# ALLOWED_ORIGINS are built from LAN_IP so presigned URLs and CORS work for
# remote clients. Defaults (no LAN_IP) keep the loopback-only behavior.
# PLAN_OVERRIDE forces the effective plan so seeded accounts can exercise
# paid-plan features without a real payment.

services:

  postgres:
    image: postgres:16-alpine
    container_name: beaver-sync-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-beaver}
      POSTGRES_USER: ${POSTGRES_USER:-beaver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beaver}
    volumes:
      - test_pg_data:/var/lib/postgresql/data
    ports:
      - "0.0.0.0:5432:5432"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beaver}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # SeaweedFS (local S3-compatible object storage; free + self-hosted)
  seaweedfs:
    image: chrislusf/seaweedfs:3.71
    container_name: beaver-sync-test-seaweedfs
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=9000 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - test_seaweed_data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "0.0.0.0:9000:9000"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: beaver-sync-test-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver}@postgres:5432/${POSTGRES_DB:-beaver}
      NODE_ENV: production
      EMAIL_ENABLED: "false"
      PLAN_OVERRIDE: ${PLAN_OVERRIDE:-free}
      ENTERPRISE_MODE: ${ENTERPRISE_MODE:-false}
      LICENSE_SECRET: ${LICENSE_SECRET:-ci-smoke-license-secret-32-chars-long!!}
      LICENSE_KEY: ${LICENSE_KEY:-BLeyJleHBpcnkiOiIyMDM1LTAxLTAxIiwibGljZW5zZWUiOiJCZWF2ZXIgQ0kgU21va2UiLCJwbGFuIjoiZW50ZXJwcmlzZSJ9.q9Mj_otTJWKIIhwfE4qV0NzhuQ_KV7HuXVlUtG9F7Eo}
      SESSION_HMAC_KEY: ${SESSION_HMAC_KEY:-ci-smoke-session-hmac-key-32-chars-long!}
      EMAIL_HMAC_KEY: ${EMAIL_HMAC_KEY:-ci-smoke-email-hmac-key-32-chars-long!!}
      COOKIE_SECRET: ${COOKIE_SECRET:-ci-smoke-cookie-secret-32-chars-long!!!}
      NOTE_HMAC_KEY: ${NOTE_HMAC_KEY:-ci-smoke-note-hmac-key-32-chars-long!!}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://seaweedfs:9000}
      STORAGE_PUBLIC_ENDPOINT: ${STORAGE_PUBLIC_ENDPOINT:-http://${LAN_IP:-localhost}:9000}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-beaver-sync}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-beaver}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-beaver-dev-secret}
      STORAGE_REGION: ${STORAGE_REGION:-us-east-1}
      STORAGE_FORCE_PATH_STYLE: ${STORAGE_FORCE_PATH_STYLE:-true}
      LEGACY_AUTH_ENABLED: ${LEGACY_AUTH_ENABLED:-true}
      ALLOWED_ORIGINS: ${TEST_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://${LAN_IP:-127.0.0.1}:5173,http://localhost:5174,http://127.0.0.1:5174}
      APP_URL: ${APP_URL:-http://localhost:4000}
    ports:
      - "0.0.0.0:${API_PORT:-4000}:3000"
    volumes:
      - beaver_data:/app/keys
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  ws-relay:
    build:
      context: .
      dockerfile: Dockerfile.ws-relay
    container_name: beaver-sync-test-ws-relay
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-beaver}:${POSTGRES_PASSWORD:-beaver}@postgres:5432/${POSTGRES_DB:-beaver}
      AUTH_BACKEND_URL: http://api:3000
      WS_RELAY_PORT: ${WS_RELAY_PORT:-8080}
      WS_RELAY_AUTH_TIMEOUT_MS: ${WS_RELAY_AUTH_TIMEOUT_MS:-10000}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
    command: ["node", "src/ws-relay.js"]
    ports:
      - "0.0.0.0:8080:8080"
    networks:
      - beaver-internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  test_pg_data:
  test_seaweed_data:
  beaver_data:

networks:
  beaver-internal:
    driver: bridge
